<div id="ss-tavo-1x-compat" hidden></div>
<script>
(() => {
  "use strict";

  const STATE_KEY = "storyState.state";
  const IMPORT_INPUT_ID = "ss-import-file";

  function nativeFileApiAvailable() {
    return !!(
      tavo?.file &&
      typeof tavo.file.import === "function" &&
      typeof tavo.file.load === "function" &&
      typeof tavo.file.export === "function"
    );
  }

  async function exportStoryState() {
    try {
      const state = tavo.get(STATE_KEY, "chat");
      if (!state || typeof state !== "object" || Array.isArray(state)) {
        throw new Error("No StoryState data is available in this chat.");
      }

      const payload = JSON.stringify({
        format: "tavo-storystate",
        exportedAt: new Date().toISOString(),
        state
      }, null, 2);

      await tavo.file.export(
        `tavo-storystate-${Date.now()}.json`,
        payload,
        { encoding: "utf8" }
      );
    } catch (error) {
      console.error("[StoryState] Native export failed", error);
      tavo.utils.toast(`StoryState export failed: ${error?.message || "unknown error"}`);
    }
  }

  async function importStoryState() {
    let imported = null;
    try {
      const files = await tavo.file.import({
        multiple: false,
        scope: "chat",
        extensions: ["json"],
        conflict: "rename"
      });
      imported = Array.isArray(files) ? files[0] : null;
      if (!imported) return;

      const raw = await tavo.file.load(imported.path, { encoding: "utf8" });
      if (typeof raw !== "string" || !raw.trim()) throw new Error("The selected JSON file is empty.");

      // Reuse StoryState's existing import validator, migration, recovery snapshot,
      // and confirmation flow. The native Tavo picker supplies the bytes; this
      // synthetic File only feeds those bytes into the already-tested panel handler.
      const input = document.getElementById(IMPORT_INPUT_ID);
      if (!input) throw new Error("StoryState import control is unavailable.");
      if (typeof File !== "function" || typeof DataTransfer !== "function") {
        throw new Error("This Tavo WebView cannot bridge the selected file into StoryState.");
      }

      const file = new File(
        [raw],
        imported.originalName || imported.name || "storystate.json",
        { type: "application/json" }
      );
      const transfer = new DataTransfer();
      transfer.items.add(file);
      input.files = transfer.files;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    } catch (error) {
      console.error("[StoryState] Native import failed", error);
      tavo.utils.toast(`StoryState import failed: ${error?.message || "unknown error"}`);
    } finally {
      if (imported?.path && typeof tavo?.file?.delete === "function") {
        try { await tavo.file.delete(imported.path); } catch (_) { }
      }
    }
  }

  // The original 0.93-era panel uses browser download/input clicks. Keep those as a
  // fallback on older Tavo builds, but intercept the two buttons when the native 1.x
  // file API is available.
  document.addEventListener("click", (event) => {
    const button = event.target?.closest?.("#ss-export, #ss-import");
    if (!button || !nativeFileApiAvailable()) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    if (button.id === "ss-export") void exportStoryState();
    if (button.id === "ss-import") void importStoryState();
  }, true);
})();
</script>
