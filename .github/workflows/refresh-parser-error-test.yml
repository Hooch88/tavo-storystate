name: One-time StoryState parser-error test refresh

on:
  push:
    branches: [refactor/0.9.0-maintenance]
    paths:
      - '.github/workflows/refresh-parser-error-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.9.0-maintenance
          fetch-depth: 0
      - name: Refresh parser error wording expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/extraction.test.cjs')
          s = p.read_text()
          old = "assert.throws(() => parseExtractionResponse('not json'), /JSON object/);"
          new = "assert.throws(() => parseExtractionResponse('not json'), /not usable JSON/i);"
          if old not in s:
            raise SystemExit('Missing stale parser error assertion')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit refreshed parser error test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/extraction.test.cjs
          git commit -m "test: refresh extractor parse error expectation"
          git push origin HEAD:refactor/0.9.0-maintenance
