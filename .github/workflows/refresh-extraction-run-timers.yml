name: One-time StoryState extraction-run timer refresh

on:
  push:
    branches: [refactor/0.9.0-maintenance]
    paths:
      - '.github/workflows/refresh-extraction-run-timers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.9.0-maintenance
          fetch-depth: 0
      - name: Refresh fake timer behavior for runtime timeout support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/extraction-run.test.cjs')
          s = p.read_text()
          old = "setInterval() { return 1; }, clearInterval() {}, setTimeout(fn) { if (typeof fn === 'function') fn(); return 1; },"
          new = "setInterval() { return 1; }, clearInterval() {}, setTimeout() { return 1; }, clearTimeout() {},"
          if old not in s:
            raise SystemExit('Missing stale immediate setTimeout mock')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit refreshed extraction-run timer harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/extraction-run.test.cjs
          git commit -m "test: support extraction timeout wrapper in integration harness"
          git push origin HEAD:refactor/0.9.0-maintenance
