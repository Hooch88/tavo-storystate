name: Package Tavo TPG

on:
  push:
    branches: [main, refactor/0.9.0-maintenance, feature/ui-vnext-rebuild]
    paths:
      - 'manifest.json'
      - 'entry.js'
      - 'locales/**'
      - 'ui/**'
      - 'src/**'
      - 'scripts/build.cjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/package-tpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify modular source and regression suite
        run: npm test
      - name: Sync generated UI artifact on preview branch
        if: github.ref == 'refs/heads/feature/ui-vnext-rebuild'
        shell: bash
        run: |
          if git diff --quiet -- entry.js ui/panel.html; then
            echo "Generated artifacts already match source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add entry.js ui/panel.html
            git commit -m "build: sync StoryState structural UI artifacts"
            git push
          fi
      - name: Read plugin version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Validate manifest/package version parity
        shell: bash
        run: test "$(jq -r '.version' manifest.json)" = "$(node -p "require('./package.json').version")"
      - name: Stage package root
        shell: bash
        run: |
          mkdir -p package/locales package/ui
          cp manifest.json entry.js package/
          cp locales/en.json package/locales/
          cp ui/panel.html package/ui/
      - name: Validate archive root
        shell: bash
        run: |
          test -f package/manifest.json
          test -f package/entry.js
          test -f package/locales/en.json
          test -f package/ui/panel.html
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: tavo-storystate-${{ steps.version.outputs.version }}
          path: package/
          if-no-files-found: error
          retention-days: 30
