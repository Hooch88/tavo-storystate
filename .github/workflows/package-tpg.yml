name: Package Tavo TPG

on:
  push:
    branches: [main, refactor/0.9.0-maintenance]
    paths:
      - 'manifest.json'
      - 'entry.js'
      - 'locales/**'
      - 'ui/**'
      - 'src/**'
      - 'scripts/build.cjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/package-tpg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Modular source, schema 12, and handoff regressions must pass before packaging.
      - name: Verify modular source and regression suite
        run: npm test
      - name: Read plugin version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Validate manifest/package version parity
        shell: bash
        run: test "$(jq -r '.version' manifest.json)" = "$(node -p "require('./package.json').version")"
      - name: Stage package root
        shell: bash
        run: |
          mkdir -p package/locales package/ui
          cp manifest.json entry.js package/
          cp locales/en.json package/locales/
          cp ui/panel.html package/ui/
      - name: Validate archive root
        shell: bash
        run: |
          test -f package/manifest.json
          test -f package/entry.js
          test -f package/locales/en.json
          test -f package/ui/panel.html
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: tavo-storystate-${{ steps.version.outputs.version }}
          path: package/
          if-no-files-found: error
          retention-days: 30
