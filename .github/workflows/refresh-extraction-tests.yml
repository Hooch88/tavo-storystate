name: One-time StoryState extraction-test refresh

on:
  push:
    branches: [refactor/0.9.0-maintenance]
    paths:
      - '.github/workflows/refresh-extraction-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.9.0-maintenance
          fetch-depth: 0
      - name: Refresh schema-12 proposal parser expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/extraction.test.cjs')
          s = p.read_text()
          old = "assert.deepStrictEqual(plain(parsed), { npcProposals: [], relationshipProposals: [] });"
          new = "assert.deepStrictEqual(plain(parsed), { npcProposals: [], relationshipProposals: [], informationProposals: [], knowledgeProposals: [], arcProposals: [] });"
          if old not in s:
            raise SystemExit('Missing stale parser expectation')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit refreshed extraction test baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/extraction.test.cjs
          git commit -m "test: refresh schema 12 extraction proposal expectations"
          git push origin HEAD:refactor/0.9.0-maintenance
