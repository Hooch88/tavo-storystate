name: One-time StoryState NPC quality v4 patch

on:
  push:
    branches: [feature/npc-quality-v4]
    paths:
      - '.github/workflows/phase1b-npc-quality-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/npc-quality-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v4 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def one(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: expected 1, found {s.count(old)}: {old[:90]!r}')
              p.write_text(s.replace(old,new,1))

          def one_after(path, marker, old, new):
              p=Path(path); s=p.read_text()
              if marker not in s: raise SystemExit(f'{path}: marker missing')
              head,tail=s.split(marker,1)
              if tail.count(old)!=1: raise SystemExit(f'{path}: expected 1 after marker, found {tail.count(old)}: {old[:90]!r}')
              p.write_text(head+marker+tail.replace(old,new,1))

          one('src/entry/02-context.js','appearance: concise stable visual anchor\ncommunication: concise speech/voice signature only; no gestures, facial expressions, posture, eye behavior, hand movements, or recurring physical mannerisms\nmotive: current concrete motive; omit if none is established','appearance: concise stable visual anchor\nmotive: current concrete motive; omit if none is established')
          one('src/entry/02-context.js','Communication means how the NPC speaks: vocabulary, cadence, directness, formality, dialect, or genuinely recurring verbal habits. Do not encode body-language tics as communication. A single colorful gesture is scene behavior, not a stable personality trait.','Speech/voice is learned by StoryState extraction from repeated dialogue evidence; do not include communication, voice, or speech fields in this hint. A single colorful behavior or line delivery is scene behavior, not a stable personality trait.')
          one('src/ui/runtime/05-npc-hint-adapters.js','appearanceAnchor:text(fields.appearance||fields.appearanceanchor,700),communicationSignature:text(fields.communication||fields.voice||fields.speech,700),currentMotive:text(fields.motive||fields.currentmotive,700)','appearanceAnchor:text(fields.appearance||fields.appearanceanchor,700),currentMotive:text(fields.motive||fields.currentmotive,700)')
          one_after('src/ui/runtime/05-npc-hint-adapters.js','function applyStructuredNpcHints','appearanceAnchor:data.appearanceAnchor,communicationSignature:data.communicationSignature,currentMotive:data.currentMotive','appearanceAnchor:data.appearanceAnchor,currentMotive:data.currentMotive')
          one_after('src/ui/runtime/05-npc-hint-adapters.js','function applyStructuredNpcHints','["role","age","pronouns","appearanceAnchor","communicationSignature"]','["role","age","pronouns","appearanceAnchor"]')

          p=Path('src/ui/runtime/06-proposal-application.js'); s=p.read_text()
          old='const fields=proposal?.fields&&typeof proposal.fields==="object"?proposal.fields:{};const residence=evidenceLooksLikeResidence(ids,messageMap)?text(fields.residence,240):"";const npc=normalizeNpc({name,aliases:proposal?.aliases,role:fields.role,age:fields.age,pronouns:fields.pronouns,residence,residenceSourceMessageId:residence?ids.at(-1):null,appearanceAnchor:fields.appearanceAnchor,communicationSignature:fields.communicationSignature,pressureResponse:fields.pressureResponse,coreValue:fields.coreValue,currentMotive:fields.currentMotive,contradiction:fields.contradiction'
          new='const fields=proposal?.fields&&typeof proposal.fields==="object"?proposal.fields:{},allowCommunication=ids.length>=2;const residence=evidenceLooksLikeResidence(ids,messageMap)?text(fields.residence,240):"";const npc=normalizeNpc({name,aliases:proposal?.aliases,role:fields.role,age:fields.age,pronouns:fields.pronouns,residence,residenceSourceMessageId:residence?ids.at(-1):null,appearanceAnchor:fields.appearanceAnchor,communicationSignature:allowCommunication?fields.communicationSignature:"",pressureResponse:fields.pressureResponse,coreValue:fields.coreValue,currentMotive:fields.currentMotive,contradiction:fields.contradiction'
          if s.count(old)!=1: raise SystemExit('create block mismatch')
          s=s.replace(old,new,1)
          old='const fields=proposal?.fields&&typeof proposal.fields==="object"?proposal.fields:{};let touched=false;'
          new='const fields=proposal?.fields&&typeof proposal.fields==="object"?proposal.fields:{},allowCommunication=ids.length>=2;let touched=false;'
          if s.count(old)!=1: raise SystemExit('update block mismatch')
          s=s.replace(old,new,1)
          old='for(const key of ["role","age","pronouns","appearanceAnchor","communicationSignature","pressureResponse","coreValue","contradiction"]){if(npc.manualOverrides.includes(key)||text(npc[key],700))continue;const value=text(fields[key],key==="role"?180:key==="age"||key==="pronouns"?80:700);if(value){npc[key]=value;touched=true}}'
          new='for(const key of ["role","age","pronouns","appearanceAnchor","pressureResponse","coreValue","contradiction"]){if(npc.manualOverrides.includes(key)||text(npc[key],700))continue;const value=text(fields[key],key==="role"?180:key==="age"||key==="pronouns"?80:700);if(value){npc[key]=value;touched=true}}if(allowCommunication&&!npc.manualOverrides.includes("communicationSignature")&&!text(npc.communicationSignature,700)){const voice=text(fields.communicationSignature,700);if(voice){npc.communicationSignature=voice;touched=true}}'
          if s.count(old)!=1: raise SystemExit('stable loop mismatch')
          s=s.replace(old,new,1)
          rule='- communicationSignature = SPEECH/VOICE ONLY: vocabulary, cadence, sentence shape, directness, formality, dialect/accent, and genuinely recurring verbal habits. NEVER store physical gestures, facial expressions, posture, eye behavior, hand movements, spectacle adjustments, folded arms/hands, tapping, staring, or other stage business here.\\n'
          add='- Only propose communicationSignature when at least two distinct evidence messages where the NPC actually speaks support the same stable voice pattern. One scene or one memorable line is insufficient.\\n'
          if s.count(rule)!=1: raise SystemExit('voice rule mismatch')
          p.write_text(s.replace(rule,rule+add,1))

          for f in ('package.json','manifest.json'):
              p=Path(f); d=json.loads(p.read_text()); d['version']='0.8.0-dev.4'; p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          p=Path('README.md'); p.write_text(p.read_text().replace('0.8.0-dev.3','0.8.0-dev.4'))
          p=Path('RELEASE_NOTES.md'); s=p.read_text(); sec='## 0.8.0-dev.4 — Structured voice hardening\n\n- Structured NPC Hints no longer define Communication/Speech fields.\n- Structured hint parsing ignores legacy `communication`, `voice`, and `speech` fields instead of persisting them.\n- Stable `communicationSignature` is now learned only by extraction with at least two evidence messages.\n- Extractor guidance requires repeated actual NPC dialogue evidence for a stable voice signature.\n- No schema, relationship, Knowledge, World Arc, scan cadence, or persistence-key changes.\n\n'
          if '## 0.8.0-dev.4' not in s:
              h,r=s.split('\n',1); p.write_text(h+'\n\n'+sec+r.lstrip('\n'))
          PY
      - name: Rebuild and test
        run: |
          node scripts/build.cjs
          npm test
      - name: Package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/package/locales dist/package/ui
          cp manifest.json entry.js dist/package/
          cp locales/en.json dist/package/locales/
          cp ui/panel.html dist/package/ui/
          cd dist/package
          zip -r ../tavo-storystate-0.8.0-dev.4.tpg manifest.json entry.js locales ui
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json README.md RELEASE_NOTES.md src entry.js ui/panel.html tests/npc-quality.test.cjs
          git commit -m "fix: harden StoryState NPC voice learning"
          git push origin HEAD:feature/npc-quality-v4
      - name: Upload TPG
        uses: actions/upload-artifact@v4
        with:
          name: tavo-storystate-0.8.0-dev.4
          path: dist/tavo-storystate-0.8.0-dev.4.tpg
          if-no-files-found: error
          retention-days: 30
