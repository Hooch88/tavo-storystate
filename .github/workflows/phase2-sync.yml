name: Sync StoryState Phase 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, 'rerun StoryState Phase 2 sync with safe transport')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified Phase 2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/p2c.part* > /tmp/ss-p2.b64
          echo "cc086ed5388e5cd096244c56dce996deb40af4bb4f9b82056cafaefe66afaae0  /tmp/ss-p2.b64" | sha256sum -c -
          base64 -d /tmp/ss-p2.b64 > /tmp/ss-p2.diff.gz
          gzip -dc /tmp/ss-p2.diff.gz > /tmp/ss-p2.diff
          patch -p1 < /tmp/ss-p2.diff
          git diff --check
      - name: Run StoryState Phase 2 checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
      - name: Verify exact Phase 2 source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { test "$(git hash-object "$1")" = "$2" || { echo "Blob mismatch: $1"; exit 1; }; }
          check_blob README.md c5ec0a516ff00efaa0c9436ce27412b0815d9493
          check_blob docs/ARCHITECTURE.md 3346561d2898043cdce897d32c4888460f7ce545
          check_blob docs/DATA_MODEL.md 2ecd6b483b39e619a8861a46b7d694b579622ea0
          check_blob docs/PROJECT_PLAN.md ae9c047bd5d1acf7900e78cab682209f9437f2af
          check_blob docs/ROADMAP.md 9b6d124271dc3f0b97a835732f6f5aae66757ff6
          check_blob docs/TAVO_API_NOTES.md 00d980b8dca4cdc9e94dc5a06cb0751c2a6aa03a
          check_blob docs/TEST_PLAN.md 645617b83975f4ab971bb980a85eef7688b92ec5
          check_blob entry.js 7c50f9e3ff49a73fce148bb1b0c39db1db34ea2f
          check_blob manifest.json 217f21a8a253e8b32d477fab5df84007498b91c5
          check_blob package.json 2059f746a4c9bb9b7eb64f672f0e66ae534f675d
          check_blob tests/extraction-run.test.cjs f0eeb262207597339724676ed272e35d61788c91
          check_blob tests/extraction.test.cjs ea7746a6af75ec506bff8b340f9676408c21acea
          check_blob tests/state-model.test.cjs 0957868b6b6c3352ea1ef8ce18016525cc24a1d3
          check_blob ui/panel.html 28fe8dfbeecfed725be4ea53278244e877d0375a
      - name: Commit clean Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transport .github/workflows/phase2-sync.yml
          git config user.name "Hooch88"
          git config user.email "155849308+Hooch88@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Phase 2 batched extraction"
          git push origin main
