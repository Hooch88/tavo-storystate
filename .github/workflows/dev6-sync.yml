name: Sync StoryState dev6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply verified dev6 patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .transport/dev6.part00 ]; then
            echo "No dev6 transport present; nothing to do."
            exit 0
          fi
          cat .transport/dev6.part* > /tmp/dev6.b64
          echo "a37db70f661d0e1e99428bb52880e40ad985b68ed126d84d8bab89e1cf333aeb  /tmp/dev6.b64" | sha256sum -c -
          base64 -d /tmp/dev6.b64 > /tmp/dev6.diff.gz
          gzip -dc /tmp/dev6.diff.gz > /tmp/dev6.diff
          patch -p1 < /tmp/dev6.diff

      - name: Run StoryState checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Verify exact dev6 source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { test "$(git hash-object "$1")" = "$2" || { echo "Blob mismatch: $1"; exit 1; }; }
          check_blob README.md e44da409e183d459ec05f7d6e61d999d76dfc7a7
          check_blob docs/ARCHITECTURE.md 83c95c932bc9f870648e95ac2824de393f620b4e
          check_blob docs/DATA_MODEL.md d26612f05fb6c67a3beacd4d009a9bafbe65d987
          check_blob docs/PROJECT_PLAN.md 66b9ddf0cb58142e0cb02d9766cfabcb72fb532c
          check_blob docs/ROADMAP.md 573b867f7d83d9b7a9b964ab3657528d266f9967
          check_blob docs/TAVO_API_NOTES.md 70a5a6e10136c87aaa6a80007247d69d5eae58b4
          check_blob docs/TEST_PLAN.md 68bdb35947194e17b81797a69ed7db74a9cac2c8
          check_blob entry.js c53142d0e66bf122f36af62fe734f74d48ef19fe
          check_blob manifest.json 69bb93fc73e5f9f97911de3af495f3e8e181d726
          check_blob package.json 6d7e24d85721fe2a67046b88a5c4ffd16165cff7
          check_blob tests/context-injection.test.cjs 491c190b42d1e36177a8647c651db91ec84580ff
          check_blob tests/state-model.test.cjs 10bb169eb90ec15a09f9b6971425ba581114eed4
          check_blob ui/panel.html 5cf317d4323a8449fbc7df1a655bf914d1bf1d07

      - name: Commit clean dev6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transport .github/workflows/dev6-sync.yml
          git config user.name "Hooch88"
          git config user.email "155849308+Hooch88@users.noreply.github.com"
          git add -A
          git commit -m "feat: add campaign session handoff"
          git push origin main
