name: Sync StoryState dev5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified dev5 patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .transport/dev5.part00 ]; then
            echo "No dev5 transport present; nothing to do."
            exit 0
          fi
          cat .transport/dev5.part* > /tmp/dev5.b64
          echo "24bce7fa8aa46599b098a58819526ef13f74f342d92a30e9592ea2a0d2be10bf  /tmp/dev5.b64" | sha256sum -c -
          base64 -d /tmp/dev5.b64 > /tmp/dev5.diff.gz
          gzip -dc /tmp/dev5.diff.gz > /tmp/dev5.diff
          patch -p1 < /tmp/dev5.diff
      - name: Run StoryState checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
      - name: Verify exact dev5 source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { test "$(git hash-object "$1")" = "$2" || { echo "Blob mismatch: $1"; exit 1; }; }
          check_blob README.md 98b399071ba3998d1346b899a777bd68274ae80f
          check_blob docs/DATA_MODEL.md 94a0f24212b33ba5a74d4a3bd33deeb411034e52
          check_blob docs/PROJECT_PLAN.md 42565a2b668eb3eecd1f68da438c586bcb37932a
          check_blob docs/ROADMAP.md face7fe7e3e2ad3b990bbc8e26da59d0352ceb87
          check_blob docs/TEST_PLAN.md d46e94fbdc7296830f594d1c672d3062954dc6b5
          check_blob entry.js c7c8ba30c97186196eca739c9447c15e8b097294
          check_blob manifest.json 97c59507cf2414ec4e28c11a8c6ebb70d41d4dd8
          check_blob package.json 1b4a4daec6e7355f53e4a1c84a210c7b74eb0fc2
          check_blob tests/context-injection.test.cjs 56e0caeebc546013d35d92fd09e70e5140c8ac95
          check_blob tests/state-model.test.cjs 9443cee80d2cddb8e475f2eeb21edc3bb1a23590
          check_blob ui/panel.html 2ce0d6d906108e02db6d9fa3e8987e863355f116
      - name: Commit clean dev5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transport .github/workflows/dev5-sync.yml
          git config user.name "Hooch88"
          git config user.email "155849308+Hooch88@users.noreply.github.com"
          git add -A
          git commit -m "feat: clarify relationship status and axis semantics"
          git push origin main
