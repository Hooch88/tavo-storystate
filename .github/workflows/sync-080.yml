name: Sync StoryState 0.8.0-dev.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-080.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified StoryState 0.8.0-dev.2
        shell: bash
        run: |
          cat .sync/ss080-dev2.part1 .sync/ss080-dev2.part2 .sync/ss080-dev2.part3 .sync/ss080-dev2.part4 | base64 -d > /tmp/story.tpg
          echo 'bf8f9afbe547fdf462e264b1ba91b7e73fe1cb801385881039a3b114bdeed4e8  /tmp/story.tpg' | sha256sum -c -
          rm -rf manifest.json entry.js locales ui
          unzip -q /tmp/story.tpg -d .
          if [ -f package.json ]; then
            jq '.version="0.8.0-dev.2"' package.json > package.json.tmp
            mv package.json.tmp package.json
          fi
          rm -rf .sync
          rm -f .github/workflows/sync-080.yml
          cat > .github/workflows/package-tpg.yml <<'EOF'
          name: Package Tavo TPG

          on:
            push:
              branches: [main]
              paths:
                - 'manifest.json'
                - 'entry.js'
                - 'locales/**'
                - 'ui/**'
                - '.github/workflows/package-tpg.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            package:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Read plugin version
                  id: version
                  shell: bash
                  run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"
                - name: Stage package root
                  shell: bash
                  run: |
                    mkdir -p package/locales package/ui
                    cp manifest.json entry.js package/
                    cp locales/en.json package/locales/
                    cp ui/panel.html package/ui/
                - name: Validate archive root
                  shell: bash
                  run: |
                    test -f package/manifest.json
                    test -f package/entry.js
                    test -f package/locales/en.json
                    test -f package/ui/panel.html
                - name: Upload installable package
                  uses: actions/upload-artifact@v4
                  with:
                    name: tavo-storystate-${{ steps.version.outputs.version }}
                    path: package/
                    if-no-files-found: error
                    retention-days: 30
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync StoryState 0.8.0-dev.2 from verified TPG"
          git push