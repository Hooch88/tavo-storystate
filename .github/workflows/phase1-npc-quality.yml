name: One-time StoryState NPC quality patch

on:
  push:
    branches: [feature/npc-personality-quality]
    paths:
      - '.github/workflows/phase1-npc-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/npc-personality-quality
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply NPC extraction and narrator-quality changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def must_replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              found = s.count(old)
              expected = 1 if count is None else count
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {found}: {old[:120]!r}')
              p.write_text(s.replace(old, new, expected))

          # 1) Narrator context: preserve identity without turning traits into repeated stage directions.
          p = Path('src/entry/02-context.js')
          s = p.read_text()
          old = '    add("Recency rule: StoryState is persistent prior state. Explicit newer visible events in the current request or recent chat take precedence over stale extracted state. Manual corrections remain authoritative for stable corrected facts unless the user explicitly changes them.", true);'
          new = old + '\n    add("NPC performance rule: Preserve personality, vary expression. Stored communication and pressure traits are tendencies and boundaries, not required gestures, phrases, poses, or stage directions. Do not repeat the same mannerism merely to signal identity; let the current situation, mood, relationship, and pressure change how the same personality is expressed.", true);\n    add("Dynamic-state rule: A Last known motive is prior state, not a command. Newer visible scene evidence overrides it, and a completed or abandoned motive must not keep driving behavior after the story has moved on.", true);'
          if s.count(old) != 1:
              raise SystemExit('Could not locate StoryState recency context anchor')
          s = s.replace(old, new, 1)
          if s.count('if (npc.communicationSignature) add(`Communication: ${text(npc.communicationSignature, 280)}`);') != 1:
              raise SystemExit('Could not locate communication injection label')
          s = s.replace('if (npc.communicationSignature) add(`Communication: ${text(npc.communicationSignature, 280)}`);', 'if (npc.communicationSignature) add(`Speech/voice: ${text(npc.communicationSignature, 280)}`);', 1)
          if s.count('if (npc.currentMotive) add(`Current motive: ${text(npc.currentMotive, 300)}`);') != 1:
              raise SystemExit('Could not locate motive injection label')
          s = s.replace('if (npc.currentMotive) add(`Current motive: ${text(npc.currentMotive, 300)}`);', 'if (npc.currentMotive) add(`Last known motive: ${text(npc.currentMotive, 300)}`);', 1)
          s = s.replace('communication: concise speech/communication signature', 'communication: concise speech/voice signature only; no gestures, facial expressions, posture, eye behavior, hand movements, or recurring physical mannerisms', 1)
          s = s.replace('motive: current concrete motive', 'motive: current concrete motive; omit if none is established', 1)
          protocol_anchor = 'Tier must be MAJOR, SUPPORT, or MINOR. Omit unknown fields; never invent details merely to fill the block. Use MAJOR/SUPPORT only for recurring or important characters. MINOR is for one-scene/background named characters.'
          protocol_new = protocol_anchor + '\nCommunication means how the NPC speaks: vocabulary, cadence, directness, formality, dialect, or genuinely recurring verbal habits. Do not encode body-language tics as communication. A single colorful gesture is scene behavior, not a stable personality trait.'
          if s.count(protocol_anchor) != 1:
              raise SystemExit('Could not locate Structured NPC Hint protocol anchor')
          s = s.replace(protocol_anchor, protocol_new, 1)
          p.write_text(s)

          # 2) Extractor semantics + an explicit evidence-gated way to clear completed motives.
          p = Path('src/ui/runtime/06-proposal-application.js')
          s = p.read_text()
          motive_old = '      const motive=text(fields.currentMotive,700);if(motive&&motive!==npc.currentMotive){npc.currentMotive=motive;touched=true}'
          motive_new = '      const motive=text(fields.currentMotive,700),clearMotive=proposal?.clearCurrentMotive===true;if(motive&&motive!==npc.currentMotive){npc.currentMotive=motive;touched=true}else if(clearMotive&&npc.currentMotive){npc.currentMotive="";touched=true}'
          if s.count(motive_old) != 1:
              raise SystemExit('Could not locate currentMotive update logic')
          s = s.replace(motive_old, motive_new, 1)

          prompt_anchor = "return `You are StoryState's conservative state extractor. Analyze ONLY the supplied saved story messages and current state. Do not continue the story. Output exactly one JSON object and no markdown.\\n\\n"
          prompt_rules = (
              "NPC FIELD SEMANTICS — keep these categories distinct:\\n"
              "- communicationSignature = SPEECH/VOICE ONLY: vocabulary, cadence, sentence shape, directness, formality, dialect/accent, and genuinely recurring verbal habits. NEVER store physical gestures, facial expressions, posture, eye behavior, hand movements, spectacle adjustments, folded arms/hands, tapping, staring, or other stage business here.\\n"
              "- pressureResponse = how the NPC's thinking, emotion, judgment, or decision-making characteristically changes under genuine pressure. Do not store ordinary job procedure, policy, negotiation terms, or generic professional calm as a pressure response.\\n"
              "- coreValue = a durable underlying priority that explains choices across situations; not the current task or contract.\\n"
              "- currentMotive = the NPC's current concrete objective. It is dynamic, not personality. Replace it when a new objective is clearly established. If the existing motive is explicitly completed, abandoned, or made impossible and no replacement is established, set clearCurrentMotive=true. Never clear it merely because the NPC leaves the scene or because the motive is not mentioned.\\n"
              "- contradiction = an evidence-based internal tension, vulnerability, blind spot, or competing desire. Leave it empty when the story has not established one; never invent a flaw just to fill the field.\\n"
              "- appearanceAnchor = stable identifying appearance only. Do not promote a one-scene pose or gesture into appearance.\\n"
              "A single colorful behavior is scene behavior, not a stable personality trait. Stable NPC fields should be conservative and should not become a list of recurring stage directions.\\n\\n"
          )
          if s.count(prompt_anchor) != 1:
              raise SystemExit('Could not locate extractor prompt anchor')
          s = s.replace(prompt_anchor, prompt_anchor + prompt_rules, 1)

          schema_old = '\"fields\":{\"role\":\"\",\"age\":\"\",\"pronouns\":\"\",\"residence\":\"\",\"appearanceAnchor\":\"\",\"communicationSignature\":\"\",\"pressureResponse\":\"\",\"coreValue\":\"\",\"currentMotive\":\"\",\"contradiction\":\"\"},\"evidenceMessageIds\"'
          schema_new = '\"fields\":{\"role\":\"\",\"age\":\"\",\"pronouns\":\"\",\"residence\":\"\",\"appearanceAnchor\":\"\",\"communicationSignature\":\"\",\"pressureResponse\":\"\",\"coreValue\":\"\",\"currentMotive\":\"\",\"contradiction\":\"\"},\"clearCurrentMotive\":false,\"evidenceMessageIds\"'
          if s.count(schema_old) != 1:
              raise SystemExit('Could not locate NPC proposal output schema')
          s = s.replace(schema_old, schema_new, 1)
          p.write_text(s)

          # 3) Functional regression: completed motives can clear, but only through an explicit proposal.
          p = Path('tests/extraction.test.cjs')
          s = p.read_text()
          test_anchor = "assert.strictEqual(clampRelationshipTarget(2, 10), 4);"
          test_block = r'''
// A completed current motive may be explicitly cleared without changing the persistent schema.
{
  const state = newState();
  state.npcs.push(normalizeNpc({ id: 'npc-motive', name: 'Mara Bell', currentMotive: 'Deliver the sealed letter' }));
  const messages = mapMessages([{ id: 300, role: 'assistant', content: 'Mara hands over the sealed letter. The delivery is complete, and she has no new assignment.' }]);
  applyExtractionProposals(state, {
    npcProposals: [{ action: 'update', npcId: 'npc-motive', name: 'Mara Bell', fields: {}, clearCurrentMotive: true, evidenceMessageIds: [300] }],
    relationshipProposals: [], informationProposals: [], knowledgeProposals: [], arcProposals: []
  }, messages, new Set());
  assert.strictEqual(state.npcs[0].currentMotive, '', 'An explicit evidence-backed clearCurrentMotive proposal should retire a completed motive.');
}

'''
          if s.count(test_anchor) != 1:
              raise SystemExit('Could not locate extraction test insertion anchor')
          s = s.replace(test_anchor, test_block + test_anchor, 1)
          p.write_text(s)

          # 4) Static guardrails for the narrator-facing behavior we are fixing.
          quality_test = r'''const fs = require('fs');
const path = require('path');
const assert = require('assert');

const entry = fs.readFileSync(path.join(__dirname, '..', 'entry.js'), 'utf8');
const panel = fs.readFileSync(path.join(__dirname, '..', 'ui', 'panel.html'), 'utf8');

assert(entry.includes('NPC performance rule: Preserve personality, vary expression.'), 'Narrator context must tell models to vary expression while preserving personality.');
assert(entry.includes('Speech/voice:'), 'Communication state should be presented to the narrator as speech/voice.');
assert(entry.includes('Last known motive:'), 'Dynamic motives must be labeled as prior state rather than an imperative.');
assert(entry.includes('no gestures, facial expressions, posture, eye behavior, hand movements, or recurring physical mannerisms'), 'Structured NPC hints must keep physical tics out of communication.');
assert(panel.includes('communicationSignature = SPEECH/VOICE ONLY'), 'Extractor must separate speech/voice from stage business.');
assert(panel.includes('clearCurrentMotive=true'), 'Extractor must know how to retire a completed motive explicitly.');
assert(panel.includes('A single colorful behavior is scene behavior, not a stable personality trait.'), 'Extractor must not promote one-scene gestures into personality anchors.');

console.log('StoryState NPC quality regression tests passed.');
'''
          Path('tests/npc-quality.test.cjs').write_text(quality_test)

          # 5) Add the new regression test to the normal suite.
          p = Path('package.json')
          package = json.loads(p.read_text())
          package['version'] = '0.8.0-dev.3'
          for key in ('test', 'check'):
              script = package.get('scripts', {}).get(key, '')
              if 'tests/npc-quality.test.cjs' not in script:
                  script = script + ' && node tests/npc-quality.test.cjs'
              package['scripts'][key] = script
          p.write_text(json.dumps(package, indent=2) + '\n')

          p = Path('manifest.json')
          manifest = json.loads(p.read_text())
          manifest['version'] = '0.8.0-dev.3'
          p.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          # 6) Documentation/release note.
          notes = Path('RELEASE_NOTES.md')
          current = notes.read_text() if notes.exists() else '# StoryState Release Notes\n\n'
          section = '''## 0.8.0-dev.3 — NPC personality quality\n\n- Tightens NPC extraction semantics so Communication stores speech/voice rather than physical mannerisms.\n- Clarifies Pressure Response, Core Value, Current Motive, Contradiction, and Appearance boundaries.\n- Adds explicit `clearCurrentMotive` extraction behavior for completed or abandoned motives without changing StoryState schema 12.\n- Narrator context now says to preserve personality while varying its expression and treats stored traits as tendencies rather than recurring stage directions.\n- Narrator context labels dynamic motive state as **Last known motive** so newer scene evidence takes precedence.\n- Structured NPC Hints now forbid body-language tics in the communication field.\n- No relationship, Knowledge, World Arc, scan cadence, persistence-key, or schema changes.\n\n'''
          if '## 0.8.0-dev.3' not in current:
              if current.startswith('# StoryState Release Notes'):
                  head, rest = current.split('\n', 1)
                  current = head + '\n\n' + section + rest.lstrip('\n')
              else:
                  current = section + current
              notes.write_text(current)

          readme = Path('README.md')
          rs = readme.read_text()
          rs = rs.replace('0.8.0-dev.2', '0.8.0-dev.3')
          readme.write_text(rs)
          PY

      - name: Rebuild generated Tavo runtime
        run: node scripts/build.cjs

      - name: Run complete regression suite
        run: npm test

      - name: Package installable TPG
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/package/locales dist/package/ui
          cp manifest.json entry.js dist/package/
          cp locales/en.json dist/package/locales/
          cp ui/panel.html dist/package/ui/
          cd dist/package
          zip -r ../tavo-storystate-0.8.0-dev.3.tpg manifest.json entry.js locales ui

      - name: Commit verified NPC quality patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json README.md RELEASE_NOTES.md src entry.js ui/panel.html tests
          git commit -m "fix: improve StoryState NPC personality extraction and injection"
          git push origin HEAD:feature/npc-personality-quality

      - name: Upload installable TPG
        uses: actions/upload-artifact@v4
        with:
          name: tavo-storystate-0.8.0-dev.3
          path: dist/tavo-storystate-0.8.0-dev.3.tpg
          if-no-files-found: error
          retention-days: 30
