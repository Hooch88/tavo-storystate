name: One-time StoryState schema-test refresh

on:
  push:
    branches: [refactor/0.9.0-maintenance]
    paths:
      - '.github/workflows/refresh-schema-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.9.0-maintenance
          fetch-depth: 0
      - name: Refresh stale schema-output expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/state-model.test.cjs')
          s = p.read_text()
          replacements = {
            "assert.strictEqual(SCHEMA_VERSION, 7, 'Phase 2 extraction schema should be v7.');": "assert.strictEqual(SCHEMA_VERSION, 12, 'Current StoryState schema should be v12.');",
            "assert.strictEqual(normalized.schemaVersion, 7);": "assert.strictEqual(normalized.schemaVersion, 12);",
            "assert.strictEqual(v2.schemaVersion, 7);": "assert.strictEqual(v2.schemaVersion, 12);",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected stale assertion: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit refreshed test baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/state-model.test.cjs
          git commit -m "test: refresh StoryState schema 12 expectations"
          git push origin HEAD:refactor/0.9.0-maintenance
